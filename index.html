<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta content="width=device-width, initial-scale=1.0" name="viewport">
    <title>Index - PhotoFolio Bootstrap Template</title>
    <meta name="description" content="">
    <meta name="keywords" content="">

    <!-- Favicons -->
    <link href="assets/img/logo.png" rel="icon">
    <link href="assets/img/logo.png" rel="apple-touch-icon">

    <!-- Vendor CSS Files -->
    <link href="assets/vendor/bootstrap/css/bootstrap.min.css" rel="stylesheet">
    <link href="assets/vendor/bootstrap-icons/bootstrap-icons.css" rel="stylesheet">

    <!-- Main CSS File -->
    <link href="assets/css/main.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
</head>

<body>
    <header id="header" class="header d-flex align-items-center sticky-top">
        <div class="container-fluid position-relative d-flex align-items-center justify-content-between">

            <a href="index.html" class="logo d-flex align-items-center me-auto me-xl-0">
            <!-- Uncomment the line below if you also wish to use an image logo -->
                <img src="assets/img/logo.png" alt="">
                <h1 class="sitename">Javascript store</h1>
            </a>

            <div class="header-social-links">
                <a href="#" class="linkedin"><i class="bi bi-linkedin"></i></a>
                <a href="#" class="github"><i class="bi bi-github"></i></a>
            </div>

        </div>
    </header>
    <main class="main p-3">
        <section class="section container my-5">
            <div class="row mb-4">
                <nav class="navbar navbar-dark bg-dark p-1">
                    <div class="container">

                        <span class="navbar-brand">
                            Your cart
                        </span>

                        <a
                            href="cart.html"
                            class="btn btn-warning">

                            Cart

                            <span
                                id="cartcount"
                                class="badge bg-dark">
                                0
                            </span>

                        </a>

                    </div>
                </nav>
            </div>
            <div class="row mb-4">

                <div class="col-md-4">
                    <input
                        type="text"
                        id="search"
                        class="form-control"
                        placeholder="Search products...">
                </div>

                <div class="col-md-3">
                    <select
                        id="category"
                        class="form-select">

                        <option value="All">All Categories</option>

                    </select>
                </div>

                <div class="col-md-3">
                    <input
                        type="number"
                        id="maxPrice"
                        class="form-control"
                        placeholder="Maximum price">
                </div>

                <div class="col-md-2">
                    <select
                        id="sort"
                        class="form-select">

                        <option value="default">Sort By</option>
                        <option value="name-asc">Name (A-Z)</option>
                        <option value="name-desc">Name (Z-A)</option>
                        <option value="price-asc">Price (Low to High)</option>
                        <option value="price-desc">Price (High to Low)</option>

                    </select>
                </div>

            </div>
            <div class="row" id="products">

            </div>

            <div class="row">
                <div class="col-md-12">

                    <nav class="mt-4">

                        <ul
                            id="pagination"
                            class="pagination justify-content-center">

                        </ul>

                    </nav>

                </div>
            </div>
        </section>

        <section class="section container my-5">
            <div class="toast-container position-fixed bottom-0 end-0 p-3">

                <div
                    id="cartToast"
                    class="toast align-items-center text-bg-success border-0"
                    role="alert"
                    aria-live="assertive"
                    aria-atomic="true">

                    <div class="d-flex">

                        <div
                            class="toast-body"
                            id="toastMessage">

                            Product added!

                        </div>

                        <button
                            type="button"
                            class="btn-close btn-close-white me-2 m-auto"
                            data-bs-dismiss="toast">
                        </button>

                    </div>

                </div>

            </div>
        </section>
    </main>

    <footer id="footer" class="footer">

        <div class="container">
            <div class="copyright text-center ">
                <p>© <span>Copyright</span> <strong class="px-1 sitename">Xplorandia</strong> <span>All Rights Reserved</span></p>
            </div>
            <div class="social-links d-flex justify-content-center">
                <a href=""><i class="bi bi-github"></i></a>
                <a href=""><i class="bi bi-linkedin"></i></a>
            </div>
        </div>

    </footer>

    <!-- Vendor JS Files -->
    <script src="assets/vendor/bootstrap/js/bootstrap.bundle.min.js"></script>

    <!-- Main JS File -->
    <script src="assets/js/products.js"></script>
    <script src="assets/js/cart.js"></script>
    <script src="assets/js/app.js"></script>

</body>

</html>
